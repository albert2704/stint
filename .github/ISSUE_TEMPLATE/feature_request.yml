name: Feature request
description: Suggest an improvement to Stint
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the problem or workflow first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Add a small example or alternatives if useful.
